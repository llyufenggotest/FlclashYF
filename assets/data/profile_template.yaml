mode: rule
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: false
keep-alive-interval: 30
keep-alive-idle: 600
mixed-port: 7890
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - +.push.apple.com
  - +.apple.com
dns:
  enable: true
  ipv6: false
  use-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  fallback:
  - https://dns.google/dns-query
  - https://cloudflare-dns.com/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  fake-ip-filter:
  - +.lan
  - +.local
  - +.localhost
  - stun.*.*
  - stun.*.*.*
  - time.*.com
  - ntp.*.com
  - +.push.apple.com
proxies: []
proxy-groups:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🎯 全球直连
  - ⚡ 自动优选
- name: 🛑 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🎯 全球直连
  type: select
  proxies:
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - 🎯 全球直连
  - ⚡ 自动优选
- name: ⚡ 自动优选
  type: url-test
  url: http://www.google.com/generate_204
  interval: 600
  lazy: true
  tolerance: 50
  proxies: []
